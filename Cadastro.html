<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro
    </title>
    <link rel="stylesheet" href="Css/Form Cadastro.css" media="screen" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script src="Js/JavaScript Cadastro.js" defer></script>
  </head>

  <body>
    <main id="container">
      <form id="login_form">
        <div id="form_header">
          <h1>Cadastro</h1>
          <i id="mode_icon" class="fa-solid fa-moon"></i>
        </div>

        <div id="msgCorrect"></div>
        <div id="msgError"></div>

        <div id="inputs">

          <div class="input-box">
            <label for="name">
              <div id="labelName">Name</div>
              <div id="input-field-name" class="input-field">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="name" name="name">
              </div>
            </label>
          </div>

          <div class="input-box">
            <label  for="email">
              <div id="labelEmail">E-mail</div>
              <div id="input-field-email" class="input-field">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" name="email">
              </div>
            </label>
          </div>

          <div class="input-box">
            <label  for="password">
              <a id="labelPassword">Password</a>
              <i id="eye_1" class="fa-solid fa-eye-slash"></i>             
              <div id="input-field-password" class="input-field">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password">
              </div>
            </label>
            </div>
            <div class="input-box">
              <label  for="password again">
                <a id="labelPasswordAgain">Password Confirm</a>
                <i id="eye_2" class="fa-solid fa-eye-slash"></i>
                <div id="input-field-password-again" class="input-field">
                  <i class="fa-solid fa-lock"></i>
                  <input type="password" id="password_again" name="password_again">
                </div>
              </label>
            </div>
          </div>

        </div>

        <button onclick="cadastrar()" id="login_button">
          Cadastrar
        </button> 
      </form>
    </main>
  </body>
</html>
