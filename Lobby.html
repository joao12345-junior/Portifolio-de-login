<!DOCTYPE html>

<meta charset="UTF-8" />

<title>Lobby</title>

<head>
  <link
    rel="stylesheet"
    type="text/css"
    href="Css/Form Lobby.css"
    media="screen"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <script src="Js/JavaScript Lobby.js" defer></script>
</head>

<body>
  <main id="container">
    <form id="user_form">
      <div id="form_header">
        <div id="texts_form">
          <div class="user_head" id="user_head">
            <label>
              <i class="fa-solid fa-circle-user"></i>
            </label>
            <h1 id="user"></h1>
          </div>
          <div id="clock_head">
            <label>
              <i class="fa-solid fa-clock"></i>
            </label>
            <h1 id="horário"></h1>
          </div>
        </div>
      </div>
    </form>

    <div id="buttons">
      <form id="Sites">
        <h2>Sites</h2>
        <div id="buttons_sites">
            <button onclick="Redirencionar_site1()" id="button" type="button">
              Site 1
            </button>
            <button onclick="Redirencionar_site2()" id="button" type="button">
              Site 2
            </button>
        </div>
      </form>
      <div id="Local_Storage">
        <form>
          <h2>Local Storage</h2>
          <div id="buttons_local_Storage">
            <div id="Getlocal_storage">
              <button onclick="GetLocalStorage()" type="button" id="button">
                Get Local Storage
              </button>
            </div>
            <div id="User_button">
              <button onclick="usuario()" type="button" id="button">
                Get User
              </button>
            </div>
            <div id="RemoveLocal_storage">
              <button onclick="RemoveLocalStorage()" type="button" id="button">
                Remove Local Storage
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div id="user_password">
      <div id="select_Forgot">
        <label for="select">
          User
          <select id="users" onchange="ResetSelection()">
            <option value="" selected>Não selecionado</option>
            <optgroup label="Emails"></optgroup>
          </select>
        </label>
      </div>
      <div id="text_password">
        <h3>A senha do usúario é </h3>
        <h3 id="Password"></h3>
      </div>
    </div>
  </main>
</body>
