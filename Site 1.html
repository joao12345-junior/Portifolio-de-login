<!DOCTYPE html>

<meta charset="UTF-8" />

<title>Site 1</title>

<head>
  <link rel="stylesheet" type="text/css" href="Css/Form Site 1.css " media="screen" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="Js/JavaScript Site 1.js" defer></script>
</head>

<body>
  <div id="sites_Ajuda">
    <form id="label_sites_ajuda">
      <h1 id="text_label">Sites Ajuda</h1>
      <h2>
        <a id="links" href="https://www.youtube.com/">Youtube</a>
        <a id="links" href="https://www.google.com/">Google</a>
        <a id="links" href="https://developer.mozilla.org/pt-BR/">Developer Mozilla</a>
        <a id="links" href="https://www.w3schools.com/">W3schools</a>
      </h2>
    </form>
  </div>
  <div id="Calcu" class="Calculadora">
    <div id="background_calcu">
      <p id="Painel" class="Painel" Name="Painel"></p>
      <div class="CalcuButton">
        <button id="button" class="Clear" onclick="Clear()">AC</button>
        <button id="button" class="operadores" onclick="Insert('()')">
          ( )
        </button>
        <button id="button" class="operadores" onclick="Insert('%')">%</button>
        <button id="button" class="operadores" onclick="Insert('/')">÷</button>
        <br />
        <button id="button" onclick="Insert('7')">7</button>
        <button id="button" onclick="Insert('8')">8</button>
        <button id="button" onclick="Insert('9')">9</button>
        <button id="button" class="operadores" onclick="Insert('*')">x</button>
        <br />
        <button id="button" onclick="Insert('4')">4</button>
        <button id="button" onclick="Insert('5')">5</button>
        <button id="button" onclick="Insert('6')">6</button>
        <button id="button" class="operadores" onclick="Insert('-')">-</button>
        <br />
        <button id="button" onclick="Insert('1')">1</button>
        <button id="button" onclick="Insert('2')">2</button>
        <button id="button" onclick="Insert('3')">3</button>
        <button id="button" class="operadores" onclick="Insert('+')">+</button>
        <br />
        <button id="button" onclick="Insert('0')">0</button>
        <button id="button" onclick="Insert('.')">,</button>
        <button id="button" onclick="Apagar()">
          <i class="fa-solid fa-delete-left"></i>
        </button>
        <button id="button" class="Resolver" onclick="Resolver()">=</button>
      </div>
    </div>
  </div>

  <section id="CalcuMedia" class="CalcuMedia">
    <form id="CalcuMedia_form">
      <div id="inputs">
        <label id="label_media" for="AnoAtual">Ano Atual
          <input id="AnoAtual" type="number" name="AnoAtual" placeholder="Digite um ano" />
        </label>

        <label id="label_media" for="RandomMax">RandomMax
          <input id="RandomMax" type="number" name="RandomMax" placeholder="Digite um número para ser o limite" />
        </label>
        <label id="label_media" for="RandomMin">RandomMin
          <input id="RandomMin" type="number" name="RandomMin" placeholder="Digite um número para ser o mínimo" />
        </label>
      </div>
      <div id="persons">
        <div id="person_1">
          <label>
            <h2>Primeria Pessoa</h2>
          </label>
          <div>Tem <span id="PrimeiraP"></span></div>
          <div>Ano sorteado foi <span id="Random1" name="Random1"></span></div>
        </div>
        <div id="person_2">
          <label>
            <h2>Segunda Pessoa</h2>
          </label>
          <div>Tem <span id="SegundaP"></span></div>
          <div>Ano sorteado foi <span id="Random2" name="Random2"></span></div>
        </div>
      </div>
      <div id="Resultado_media">
        <h1 class="Resultado_media">A média entre as idades foi <span id="Media" name="Media"></span></h1>
      </div>
      <button id="Iniciar" class="CalcuMedButton" type="reset" onclick="Reset()">
        Iniciar
      </button>
    </form>
  </section>
</body>
