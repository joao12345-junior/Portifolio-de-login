<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="Css/Form Forgot_Password.css" media="screen" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="Js/JavaScript Forgot_Password.js" defer></script>
  </head>

  <body>
    <main id="main_forgot">
      <form id="forgot_form">
        <div id="form_header">
          <h1>Esqueceu a senha?</h1>
          <i id="mode_icon" class="fa-solid fa-moon"></i>
        </div>
        <div id="msgError"></div>
        </div>
        <div id="input_Forgot">
            <input name="emailInput" class="input-field" id="emailInput" type="email" placeholder="Digite seu Email">
        </div>
        <div id="password_Forgot">
          <h2>Sua senha é</h2> 
          <h2 id="Password"></h2>        
        </div>
        <button id="submit" type="submit" onclick="Search()">Submit</button>
      </form>
    </main>
  </body>
</html>
