<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="Css/Form Login.css" media="screen" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="Js/JavaScript Login.js" defer></script>
  </head>

  <body>
    <main id="container">
      <form id="login_form">
        <div id="form_header">
          <h1 onclick="Login_TextButton()" id="Login_Text">Login</h1>

          <i id="mode_icon" class="fa-solid fa-moon"></i>
        </div>

        <div id="social_media">
          <a href="#">
            <img src="Imgs/Facebook_Logo.png" alt="Facebook Logo" />
          </a>

          <a href="#">
            <img src="Imgs/Google-Logo.png" alt="Google Logo" />
          </a>

          <a href="#">
            <img src="Imgs/GitHub Logo.png" alt="GitHub Logo" />
          </a>
        </div>

        <div id="msgCorrect"></div>
        <div id="msgError"></div>

        <div id="inputs">

          <div class="input-box">
            <label for="email">
              <div id="emailLabel">E-mail</div>
              <div id="emailInput-field" class="input-field">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" name="email">
              </div>
            </label>
          </div>

          <div class="input-box">
            <label for="password">
              <a id="passwordLabel">Password<a>
              <i id="eye" class="fa-solid fa-eye-slash"></i>
              <div id="passwordInput-field" class="input-field">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password">
              </div>
            </label>

            <div id="forgot_password">
              <a href="Forgot Password.html">
                Forgot your password?
              </a>
            </div>
          </div>
        </div>

        <button id="login_button">
          Login
        </button> 

        <div class="Cadastro">
          Não tem uma conta?  
          <a href="Cadastro.html" id="Cadastro"> Cadastre-se</a>
        </div>
      </form>
    </main>
  </body>
</html>
